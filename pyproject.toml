[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftbench-runner"
version = "0.2.0"
description = "Fresh inference and paired evaluation on the published DriftBench workloads"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
client = ["transformers==4.57.6", "tokenizers==0.22.2", "huggingface-hub==0.36.2", "sentencepiece==0.2.2", "numpy==2.2.6", "jinja2==3.1.6"]
nvidia = ["vllm==0.17.1"]
sglang = ["sglang==0.5.10.post1"]
evaluation = ["sentence-transformers==5.7.0", "accelerate==1.15.0", "transformers==4.57.6", "torch==2.10.0"]

[project.scripts]
driftbench-run = "driftbench_runner.cli:main"

[tool.setuptools.packages.find]
include = ["driftbench_runner*"]

[tool.pytest.ini_options]
testpaths = [".archive/checks"]
cache_dir = ".archive/check-output/pytest-cache"
